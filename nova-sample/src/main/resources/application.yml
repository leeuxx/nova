  # 静态资源配置（使用 Spring Boot 默认位置：public/、static/、resources/、META-INF/resources/）
  web:
    resources:
      add-mappings: true

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always