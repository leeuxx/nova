spring:
  # 数据源配置 - MySQL
  datasource:
    url: jdbc:mysql://182.43.87.123:3306/nova_demo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: '#Xynet2022'
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000

  # MyBatis-Plus 配置
  mybatis-plus:
    mapper-locations: classpath*:/mapper/*.xml
    configuration:
      map-underscore-to-camel-case: true

  # 静态资源配置（使用 Spring Boot 默认位置：public/、static/、resources/、META-INF/resources/）
  web:
    resources:
      add-mappings: true

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

# 日志配置
logging:
  level:
    com.nova: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Nova 框架配置
nova:
  enabled: true
  scan-packages: com.nova.sample.entity
  auto-create-table: true
  theme: default
  page-title: Nova 示例系统