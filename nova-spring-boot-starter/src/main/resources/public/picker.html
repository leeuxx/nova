<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Picker</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    html, body, #app { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="js/lib/vue.global.prod.js"></script>
  <script src="js/lib/naive-ui.js"></script>
  <script src="js/lib/jquery-3.7.1.min.js"></script>
  <script src="js/lib/iconify-icon.min.js"></script>

  <script src="jq/picker.js"></script>
  <script src="pages/picker.js"></script>
  <script>
    ;(function () {
      const { createApp, h } = Vue
      const { NConfigProvider, zhCN, dateZhCN, darkTheme } = naive
      const params = new URLSearchParams(window.location.search)
      const isDarkFromUrl = params.get('dark') === '1'
      const isDark = isDarkFromUrl
      if (isDark) document.body.classList.add('dark')
      document.body.style.backgroundColor = isDark ? '#151515' : '#f5f5f5'
      document.documentElement.style.backgroundColor = isDark ? '#151515' : '#f5f5f5'
      const themeOverrides = {
        common: {
          borderRadius: '6px', borderRadiusSmall: '4px',
          primaryColor: '#2563eb', primaryColorHover: '#1d4ed8', primaryColorPressed: '#1e40af'
        }
      }
      const Root = {
        render() {
          return h(NConfigProvider, {
            theme: isDark ? darkTheme : null, themeOverrides, locale: zhCN, dateLocale: dateZhCN
          }, {
            default: () => h(window.NovaPicker)
          })
        }
      }
      const app = createApp(Root)
      app.use(naive)
      app.mount('#app')
      const { message, dialog } = naive.createDiscreteApi(
        ['message', 'dialog'],
        { configProviderProps: { theme: isDark ? darkTheme : null, themeOverrides } }
      )
      window.$message = message
      window.$dialog  = dialog
      window.__pickerDark = isDark
    })()
  </script>
</body>
</html>
