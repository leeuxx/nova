<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Admin</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/404.css" />
  <link rel="stylesheet" href="css/home.css" />
  <!-- 首屏加载动画样式（跳跃方块；ID 与 loading.js 一致，避免重复注入） -->
  <style id="nova-loading-jump-css">
    .nova-jump-box{display:flex;flex-direction:column;align-items:center}
    .nova-jump-loader{height:48px;position:relative;width:48px}
    .nova-jump-loader:before{animation:nova-jump-shadow .5s linear infinite;background:rgba(37,99,235,.5);background:hsl(var(--primary,221 83% 53%)/50%);border-radius:50%;height:5px;top:60px;width:48px}
    .nova-jump-loader:after,.nova-jump-loader:before{content:"";left:0;position:absolute}
    .nova-jump-loader:after{animation:nova-jump-ani .5s linear infinite;background:#2563eb;background:hsl(var(--primary,221 83% 53%));border-radius:4px;height:100%;top:0;width:100%}
    .nova-jump-title{color:rgba(0,0,0,.85);font-size:28px;font-weight:600;margin-top:66px;text-align:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}
    .dark .nova-jump-title{color:#fff}
    @keyframes nova-jump-ani{15%{border-bottom-right-radius:3px}25%{transform:translateY(9px) rotate(22.5deg)}50%{border-bottom-right-radius:40px;transform:translateY(18px) scaleY(.9) rotate(45deg)}75%{transform:translateY(9px) rotate(67.5deg)}to{transform:translateY(0) rotate(90deg)}}
    @keyframes nova-jump-shadow{0%,to{transform:scale(1)}50%{transform:scaleX(1.2)}}
    .nova-boot-loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f5f7fa}
    .nova-boot-loading.hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease-out,visibility .5s ease-out}
    .dark .nova-boot-loading{background:#151515}
  </style>
</head>
<body>
  <!-- 主题前置：在任何 JS/CSS 渲染前同步写入 body.dark，避免刷新时白闪 -->
  <script>
    try {
      var t = localStorage.getItem('nova-theme');
      if (t === 'night') document.body.classList.add('dark');
    } catch (e) {}
  </script>
  <div id="app"></div>

  <!-- 首屏加载动画（getMenu 响应前显示）；关键样式内联，避免首次绘制时无样式闪烁导致文字从小变大 -->
  <div id="__nova-boot-loading__" class="nova-boot-loading">
    <div class="nova-jump-box">
      <div class="nova-jump-loader"></div>
      <div class="nova-jump-title"></div>
    </div>
  </div>

  <!-- 无 token（登录页）不显示加载动画：页面解析阶段直接移除 boot -->
  <script>
    if (!localStorage.getItem('nova_token')) {
      var _nb = document.getElementById('__nova-boot-loading__')
      if (_nb && _nb.parentNode) _nb.parentNode.removeChild(_nb)
    }
  </script>

  <!-- Vue 3 -->
  <script src="js/lib/vue.global.prod.js"></script>
  <!-- Vue Router -->
  <script src="js/lib/vue-router.global.prod.js"></script>
  <!-- Naive UI -->
  <script src="js/lib/naive-ui.js"></script>
  <!-- jQuery -->
  <script src="js/lib/jquery-3.7.1.min.js"></script>
  <!-- 离线图标数据（必须在 iconify-icon.min.js 之前） -->
  <script src="js/utils/icons-offline.js"></script>
  <!-- Iconify web component -->
  <script src="js/lib/iconify-icon.min.js"></script>
  <!-- QRCode -->
  <script src="js/lib/qrcode.min.js"></script>

  <!-- 全站参数配置（开发手写）+ 默认值填充 -->
  <script src="js/utils/loadResources.js"></script>
  <!-- AiEditor 异步加载器（按需加载 AiEditor） -->
  <script src="js/utils/aieditor-loader.js"></script>
  <!-- window.nova 兜底声明：config.js 直接写 window.nova.config，须先建对象 -->
  <script>window.nova = window.nova || {}</script>
  <script src="config.js"></script>
  <script src="js/utils/config-loader.js"></script>
  <!-- 通用工具函数 -->
  <script src="js/utils/dialog.js"></script>
  <script src="js/utils/popup.js"></script>
  <script src="js/utils/fetch.js"></script>
  <script src="js/utils/loading.js"></script>
  <script src="js/utils/image-preview.js"></script>
  <script src="js/utils/roll-number.js"></script>
  <script src="js/utils/file-list.js"></script>
  <!-- jQuery 业务逻辑（先加载，供 Vue 组件调用） -->
  <script src="jq/edit/form-this.js"></script>
  <script src="jq/edit/form-reference.js"></script>
  <script src="jq/edit/form-appendage.js"></script>
  <script src="jq/edit/form-link.js"></script>
  <script src="jq/edit/form-appendages.js"></script>
  <script src="jq/table.js"></script>
  <!-- jQuery 双表视图业务逻辑 -->
  <script src="jq/dual/table-appendages.js"></script>
  <script src="jq/dual/table-link.js"></script>
  <!-- Vue 通用表格页组件 -->
  <script src="pages/edit/table-this.js"></script>
  <!-- 表格按钮分类与渲染 -->
  <script src="js/utils/table-buttons.js"></script>
  <script src="pages/table.js"></script>
  <script src="pages/edit/table-appendage.js"></script>
  <script src="pages/edit/table-appendages.js"></script>
  <script src="pages/edit/table-link.js"></script>
  <script src="pages/edit/table-reference.js"></script>
  <script src="pages/dual/table-appendages.js"></script>
  <script src="pages/dual/table-link.js"></script>
  <script src="pages/dual/table-drill.js"></script>
  <!-- Vue 登录页面组件 -->
  <script src="pages/login.js"></script>
  <!-- Vue 注册页面组件 -->
  <script src="pages/register.js"></script>
  <!-- Vue 404 页面组件 -->
  <script src="pages/404.js"></script>
  <!-- Vue 首页欢迎页组件 -->
  <script src="pages/home.js"></script>
  <!-- JSON 配置加载工具 -->
  <script src="js/utils/json-loader.js"></script>
  <!-- 权限工具 -->
  <script src="js/utils/authority.js"></script>
  <!-- 消息铃铛 + 消息抽屉组件 -->
  <script src="js/utils/message.js"></script>
  <!-- 应用入口：路由 + 布局挂载 -->
  <script src="js/app.js"></script>
</body>
</html>
